<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const key = "interactive-typst-tutorial-theme";
        const isTheme = (value) => value === "light" || value === "dark";
        let storedTheme = null;

        try {
          storedTheme = localStorage.getItem(key);
        } catch {
          storedTheme = null;
        }

        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const theme = isTheme(storedTheme) ? storedTheme : systemTheme;

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeSource = isTheme(storedTheme) ? "user" : "system";
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Typst 交互式教程</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
